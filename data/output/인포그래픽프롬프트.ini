3. 핵심이슈 정리

- 6월 8일 반도체 쇼크 — 역대 11번째 낙폭 (-8.29%)

미국 SMCI(슈퍼마이크로컴퓨터) -28% 폭락 및 미·이란 군사 긴장 고조가 맞물리며 코스피·코스닥 양대 시장에서 동시에 서킷 브레이커와 매도 사이드카가 발동됐다. 젠슨 황 방한 기간임에도 지수는 방어에 실패했다. 단, 엔비디아와 직접 협력을 확인받은 NAVER, SK텔레콤, SK네트웍스는 강세를 보이며 명확한 명암이 갈렸다.

- 6월 9일 역대 최대 상승 (+612.52pt, +8.18%)

미국 반도체주 급반등 영향으로 코스피가 역대 가장 큰 포인트 상승폭을 기록했다. 코스피200 편입 200개 종목 중 169개가 올랐다. 삼성전기는 +18.39%로 현대차를 제치고 시총 4위로 올라섰다. 기관 홀로 2조4,978억원 순매수가 상승을 견인했다. 외국인의 연속 순매도는 지속.

- 미·이란 지정학 리스크 — 충돌 재개 → 종전 합의 기대 급반전

주간 최대 거시 변수였다. 6/10 개장 전 미군의 자위적 공격 개시 및 이란의 중동 미군 기지 미사일 공격 보도로 투자심리가 급격히 위축됐다(코스피 -4.52%). 6/11에도 장중 7,394pt까지 하락하며 극심한 변동성을 연출했으나, 트럼프의 공습 중단 발표에 당일 소폭 상승 전환에 성공했다. 6/12에는 합의 임박 발언으로 분위기가 완전 반전, 코스피가 6.44% 급등 출발했다.

- 스페이스X(SPCX) 나스닥 상장 + 한미반도체 500억 투자

6/12 스페이스X가 나스닥에 티커 'SPCX'로 데뷔하며 +19% 급등했다. 이날 한미반도체가 스페이스X 주식 500억원 취득을 결정했다는 소식이 전해지며 한미반도체는 +24.05% 폭등, 거래대금 3조2,065억원을 기록했다.

- 외국인 24거래일 연속 순매도 → 25거래일 만에 복귀

지난달 7일부터 이어진 외국인 구조적 매도 행진이 6/12(금) 마침내 종료됐다. 누적 규모 75조5,690억원(대체거래소 포함 84조6,290억원)으로 역대 네 번째로 긴 연속 순매도였다. 복귀 첫날 +2조1,181억원을 순매수하며 코스피 반등의 핵심 동력이 됐다.

- 글로벌 IB, 삼성전자·SK하이닉스 헤지펀드 레버리지 제한 (6/12 장 후반)

장 후반 글로벌 투자은행들이 삼성전자·SK하이닉스의 변동성 고조를 이유로 스왑 비용을 최대 11%p로 높이고 헤지펀드 레버리지 투자를 제한한다는 뉴스가 유입되며 두 종목이 급락하는 모습을 보였다. 이로 인해 코스피 종가는 장중 고점(8,400선)보다 낮은 8,123선으로 마감했다.


4. 주간 한 줄 요약
역대급 폭락(-8.29%)과 역대 최대 상승(+8.18%)이 단 이틀 만에 공존한 한 주. 미·이란 긴장과 종전 기대감이 시장의 방향을 결정했고, 스페이스X IPO와 외국인 25거래일 만의 귀환으로 코스피는 한 주를 8,100선에서 마무리했다.




첨부파일 내용으로 인포그래픽 이미지 작성. 
[스타일] 깔끔한 아이소메트릭 라인 아트, 플랫 벡터 스타일, 현대적인 테크 인포그래픽
[특징] 미니멀리즘, 단순화된 형태, 정확한 비율, 가는 세로 및 가로줄로 섹션을 명확하게 구분
[글자] 현대적이고 깔끔한 산세리프 폰트, 가독성이 높음. 명확한 시각적 위계, 메인 제목 (가장 굵음),소제목 (굵음),설명 텍스트 (일반 두께)
[컬러 팔레트] 기본 : 깔끔하고 미니멀하며 제한된 컬러 팔레트. 색상 : 메인 강조: Light Green (연두색), Sky Blue (하늘색), Teal (청록색), 기본 배경: Pure White (순수 흰색), 텍스트 & 라인: Solid Black (진한 검은색), Medium Grey (중간 회색), 섹션 강조: Dark Blue (진한 파란색 - 번호 상자 등에 사용)
[아이콘 & 일러스트 형태] 각 섹션을 위한 상세하면서도 단순화된 3D 아이소메트릭 또는 플랫 벡터 스타일 아이콘. 깔끔한 라인, 팔레트와 어울리는 부드러운 색상. 각 구획으로 나눠진 부분에 대해서 아이콘은 다른영역 침범하면 안됨.
[여백] 깔끔한 느낌을 위해 모든 텍스트와 아이콘 주변에 충분한 여백 확보.



스타일 - 아무것도 없는 비어있는 흰색 배경, 어두운 회색 텍스트, #07930E 악센트 컬러를 적용, 픽토그램과 데이터시각화, 인포그래픽 적용, 도해는 후광효과, 블러, 그라디언트 없이 벡터, 플랫, 솔리드 컬러 적용
각 슬라이드 헤드라인은 위치를 왼쪽 맞추기 정렬, 폰트 종류와 크기 모두 동일하게, 본문 텍스트는 서브 헤드라인, 본문, 캡션 등 항목별로 폰트 종류와 크기 동일하게 할  것. 각 문장 끝에는 마침표 찍지 말 것.