깔끔하고 전문적인 주식 시장 및 금융 뉴스 데이터 테이블 인포그래픽,세로가 긴 정사각형 규격. 전체 제목 없이 구성,저관여 밀도의 미니멀한 플랫 벡터 일러스트레이션 스타일,파스텔 색상 열(column) 조합, 명확한 구획과 행(row)별 레이아웃,미니멀한 2D 디자인,고품질 아이콘,깨끗한 흰색 배경,가독성 좋은 굵은 고딕체(Sans-serif) 타이포그래피,프리미엄 비즈니스 카드뉴스 스타일.


프롬프트 지시사항대로 표내용을 인포그래픽 작성. 

1.Nano Banana 2 모델를 사용해서 제작할 것.
2.4열 그리드 구조의 표형식(날짜, 국가,시간, 일정),칸 비율은 2:1:2:5
3.국가는 해당 국가 국기로만 표시
4.시간 컬러는 짙은 그레이, 날짜와, 일정은 검은색(제일 위에 타이틀 컬러는 검은색으로 통일)
5.세로가 긴 직사각형 규격
6.전체 제목 없이 구성
7.플랫 벡터 일러스트레이션
8.일정내용과 1열은 가독성 좋은 굵은 고딕체(Sans-serif) 타이포그래피, 나머지는 일반 고딕체(Sans-serif).
9.일정내용중에서 괄호안에 내용은 일반 고딕체(Sans-serif) 타이포그래피(글씨 크기는 작게). 
10.아이콘 삽입금지
11.2D 미니멀 디자인
12. 전체 배경은 엹은 파스텔톤 계열 회색.
13. 글자사이즈는 일정 내용이 한줄에 들어갈 정도의 사이즈로 

