1.시장 총평 및 지수추이

이번 주(6/8~6/12, 5거래일) 한국 증시는 월요일 미국발 반도체 쇼크로 역대급 폭락(-8.29%)을 기록했다가, 화요일 단 하루 만에 역대 최대 상승폭(+8.18%)으로 반등하는 극심한 롤러코스터 장세를 연출했다. 이후 수요일 조정 후 목·금요일에는 미·이란 종전 기대감으로 외국인이 25거래일 만에 순매수로 전환하며 코스피가 8,100선을 탈환했다.
