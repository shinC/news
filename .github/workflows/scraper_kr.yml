name: Korea Economy News Scraper

on:
  schedule:
    # 한국 시간(KST) 오후 3시 32분 = 협정 세계시(UTC) 오전 6시 32분
    # 월요일부터 금요일까지 실행 (1-5)
    - cron: '32 6 * * 1-5'
  # GitHub 웹 UI에서 수동으로도 실행 가능하도록 설정
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    # 레포지토리에 변경된 마크다운을 푸시하기 위해 쓰기 권한을 부여합니다.
    permissions:
      contents: write

    steps:
      # 1. 레포지토리 코드 복사
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. 파이썬 환경 설정
      - name: Set up Python 3.14
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          cache: 'pip' # 패키지 설치 속도 개선을 위한 캐싱 적용

      # 3. 의존성 패키지 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 한국 뉴스 수집 스크립트 실행
      - name: Run Korea News Scraper
        env:
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_SECRET_KEY: ${{ secrets.KIWOOM_SECRET_KEY }}
        run: python src/main_kr.py

      # 5. 수집된 결과(마크다운 파일)가 변경되었을 경우 GitHub에 Commit & Push
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 변경사항 확인 및 반영
          git add data/output/kr_economy_news.md
          
          # 변경된 내역이 있을 때만 커밋 수행 (에러 방지)
          if git diff --staged --quiet; then
            echo "No changes in kr_economy_news.md. Skipping push."
          else
            git commit -m "chore: auto-update kr_economy_news.md [skip ci]"
            git push
          fi
